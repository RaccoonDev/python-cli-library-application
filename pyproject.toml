[project]
name = "cli-template"
version = "0.1.0"
description = "Template for a Python library with a command-line interface"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Dmytro Mykhailov" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
# The library itself has no runtime dependencies.
dependencies = []

[project.optional-dependencies]
cli = ["typer>=0.16"]

[project.scripts]
cli-template = "cli_template.cli:main"

[dependency-groups]
dev = [
    "cli-template[cli]",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--cov=cli_template", "--cov-report=term-missing", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 90
